<!DOCTYPE html>
<html>

<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="HendyDom">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png" />

  <title>HendyChallenge Dominoes</title>
  <link rel="manifest" href="manifest.json">
</head>

<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    // Automatic update logic for Service Worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.getRegistration().then(function (reg) {
          if (reg) {
            reg.addEventListener('updatefound', () => {
              const newWorker = reg.installing;
              newWorker.addEventListener('statechange', () => {
                if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                  // New version available! Telling service worker to skip waiting...
                  newWorker.postMessage({ command: 'skipWaiting' });
                }
              });
            });
          }
        });
      });

      // Reload the page once the new service worker takes control
      let refreshing = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (refreshing) return;
        refreshing = true;
        window.location.reload();
      });
    }
  </script>

  <!-- Audio Unlock Bypass: Ensures synchronous user activation for mobile browsers -->
  <audio id="audio-unlock" style="display:none;" preload="auto">
    <source src="data:audio/wav;base64,UklGRigAAABXQVZFRm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQQAAAAAAA==" type="audio/wav">
  </audio>

  <script>
    (function () {
      // One-time synchronous unlock on the very first interaction
      const unlock = function () {
        const audio = document.getElementById('audio-unlock');
        if (audio) {
          audio.play().then(() => {
            console.log("Audio: System unlocked via synchronous capture.");
            audio.pause();
          }).catch(e => console.error("Audio: Sync unlock failed:", e));
        }

        // Global flag for Dart to check if needed
        window.isAudioUnlocked = true;

        // cleanup
        window.removeEventListener('touchstart', unlock, true);
        window.removeEventListener('mousedown', unlock, true);
      };

      window.addEventListener('touchstart', unlock, { capture: true, once: true });
      window.addEventListener('mousedown', unlock, { capture: true, once: true });
    })();
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>

</html>
