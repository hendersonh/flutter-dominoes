<!DOCTYPE html>
<html>

<head>
  <!--

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">

<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    // Versioned Heartbeat - Force-evicts stale PWAs on new deployments
    async function checkForUpdates() {
      if (!navigator.onLine) return; 

      try {
        // Fetch the microscopic version file with a cache-buster
        const response = await fetch('version.json?t=' + Date.now(), { 
          cache: 'no-store',
          headers: { 'Cache-Control': 'no-cache' }
        });
        if (!response.ok) return;
        
        const data = await response.json();
        const serverVersion = data.v;
        const localVersion = localStorage.getItem('app_version');

        if (localVersion && serverVersion !== localVersion) {
          console.log('Update detected Application Version: ' + serverVersion);
          
          // 1. Unregister ALL service workers
          if ('serviceWorker' in navigator) {
            const registrations = await navigator.serviceWorker.getRegistrations();
            for (const registration of registrations) {
              await registration.unregister();
            }
          }

          // 2. Clear ALL browser caches
          if ('caches' in window) {
            const cacheKeys = await caches.keys();
            for (const key of cacheKeys) {
              await caches.delete(key);
            }
          }

          // 3. Update local state and perform a clean hard-refresh
          localStorage.setItem('app_version', serverVersion);
          
          // Append a unique reload parameter to bypass any intermediate ISP/Browser disk caches
          const cleanUrl = window.location.origin + window.location.pathname + '?rel=' + Date.now();
          window.location.replace(cleanUrl);
        } else if (!localVersion) {
          // Initialize version tracking on first visit
          localStorage.setItem('app_version', serverVersion);
        }
      } catch (err) {
        console.warn('Update check bypassed:', err);
      }
    }

    // Run check on initial load
    window.addEventListener('load', () => {
      // Small delay to let the initial rendering finish
      setTimeout(checkForUpdates, 1000);
    });
    
    // Run check when user returns to the app (crucial for "Always On" mobile tabs)
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') {
        checkForUpdates();
      }
    });
  </script>


  <script src="flutter_bootstrap.js" async></script>
</body>

</html>
