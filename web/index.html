<!DOCTYPE html>
<html>

<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="HendyDom">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png" />

  <title>HendyChallenge Dominoes</title>
  <link rel="manifest" href="manifest.json">
</head>

<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    // Automatic update logic for Service Worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.getRegistration().then(function (reg) {
          if (reg) {
            reg.addEventListener('updatefound', () => {
              const newWorker = reg.installing;
              newWorker.addEventListener('statechange', () => {
                if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                  // New version available! Telling service worker to skip waiting...
                  newWorker.postMessage({ command: 'skipWaiting' });
                }
              });
            });
          }
        });
      });

      // Reload the page once the new service worker takes control
      let refreshing = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (refreshing) return;
        refreshing = true;
        window.location.reload();
      });
    }

    // Surgical Phase 4: Master Audio Unlocker (S24/Mobile Optimized)
    window.masterAudioUnlock = function () {
      console.log('Master Audio Unlocker triggered');

      // 1. Web Audio API (AudioContext) Persistent Resume
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      if (AudioContext) {
        if (!window._masterAudioContext) {
           window._masterAudioContext = new AudioContext();
        }
        if (window._masterAudioContext.state === 'suspended') {
          window._masterAudioContext.resume().then(() => {
            console.log('AudioContext resumed and held open');
          });
        }
      }

      // 2. HTML5 Audio Element "Session Blessing" (Looping Silence)
      if (!window._masterAudioElement) {
        const silentWav = 'data:audio/wav;base64,UklGRigAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=';
        const audio = new Audio();
        audio.src = silentWav;
        audio.setAttribute('playsinline', '');
        audio.loop = true;
        
        // Unmuted play at near-zero volume to keep session active
        audio.volume = 0.001; 
        
        const playAttempt = audio.play();
        if (playAttempt !== undefined) {
          playAttempt.then(() => {
            console.log('HTML5 Session Blessed - Looping silence active');
            window._masterAudioElement = audio;
          }).catch(e => {
            console.warn('Unmuted blessing blocked, falling back to muted...', e);
            audio.muted = true;
            audio.play().then(() => {
              console.log('HTML5 Session Blessed (Muted)');
              window._masterAudioElement = audio;
            });
          });
        }
      }
    };

    // Global Interaction Capture for Initial "Blessing"
    const initialUnlock = function () {
      window.masterAudioUnlock();
      window.removeEventListener('click', initialUnlock);
      window.removeEventListener('touchstart', initialUnlock);
      window.removeEventListener('touchend', initialUnlock);
    };
    window.addEventListener('click', initialUnlock);
    window.addEventListener('touchstart', initialUnlock);
    window.addEventListener('touchend', initialUnlock);

    // Refresh audio on visibility change
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') {
        console.log('Tab visible, nudging audio context...');
        window.masterAudioUnlock();
      }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>

</html>
