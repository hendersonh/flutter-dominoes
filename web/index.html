<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    // Aggressive Automatic Update Logic
    if ('serviceWorker' in navigator) {
      function forceUpdate(reg) {
        console.log('Update found! Forcing service worker eviction...');
        reg.unregister().then(() => {
          // Clear all web caches to ensure no stale files persist
          if ('caches' in window) {
            caches.keys().then(function(names) {
              for (let name of names) caches.delete(name);
            });
          }
          // Hard reload the page to fetch fresh Cloudflare assets
          window.location.reload(true);
        });
      }

      window.addEventListener('load', function () {
        navigator.serviceWorker.getRegistration().then(function (reg) {
          if (reg) {
            reg.addEventListener('updatefound', () => {
              const newWorker = reg.installing;
              newWorker.addEventListener('statechange', () => {
                // If a new worker installed and there's already an active one controlling the page
                if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                  forceUpdate(reg);
                }
              });
            });

            // Poll for updates when the user brings the app back to the foreground
            document.addEventListener('visibilitychange', () => {
              if (document.visibilityState === 'visible') {
                reg.update();
              }
            });
          }
        });
      });
    }
  </script>


  <script src="flutter_bootstrap.js" async></script>
</body>
